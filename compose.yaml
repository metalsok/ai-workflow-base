name: game-tracker
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: game_tracker
      POSTGRES_DB: game_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-dev.mjs first}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U game_tracker -d game_tracker']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
