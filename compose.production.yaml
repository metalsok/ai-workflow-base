name: game-tracker-private
x-app: &app
  image: ${APP_IMAGE:-game-tracker:local}
  build:
    context: .
    target: ${APP_BUILD_TARGET:-runtime}
  environment: &environment
    DATABASE_HOST: db
    DATABASE_PORT: '5432'
    DATABASE_NAME: game_tracker
    DATABASE_USER: game_tracker
    DATABASE_PASSWORD_FILE: /run/secrets/db_password
  secrets:
    - db_password
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: game_tracker
      POSTGRES_DB: game_tracker
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U game_tracker -d game_tracker']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *app
    command: ['node', 'dist/api/database/cli.js']
    environment:
      <<: *environment
      MIGRATION_LOCK_DIRECTORY: /migration-lock
    volumes:
      - ${DEPLOY_STATE_DIR:-./.deploy}/migration-lock:/migration-lock
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *app
    environment:
      <<: *environment
      BIND_HOST: 0.0.0.0
      PORT: '3000'
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:4400}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET_FILE: /run/secrets/igdb_client_secret
      TRUST_PROXY_LOOPBACK: ${TRUST_PROXY_LOOPBACK:-false}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
    secrets:
      - db_password
      - session_secret
      - igdb_client_secret
    ports:
      - '127.0.0.1:${APP_PORT:-4400}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
secrets:
  db_password:
    file: ${DEPLOY_STATE_DIR:-./.deploy}/secrets/postgres_password
  session_secret:
    file: ${DEPLOY_STATE_DIR:-./.deploy}/secrets/session_secret
  igdb_client_secret:
    file: ${DEPLOY_STATE_DIR:-./.deploy}/secrets/igdb_client_secret
