<a
  class="fixed -top-[100px] left-4 z-10 bg-surface p-4 text-accent underline focus:top-4"
  href="#main-content"
  >Skip to content</a
>
<div class="grid min-h-svh grid-cols-[220px_minmax(0,1fr)] compact:block">
  <aside
    class="flex flex-col border-r border-outline px-6 py-8 compact:border-r-0 compact:border-b compact:px-5 compact:py-4"
  >
    <a
      class="inline-flex items-center gap-[0.7rem] whitespace-nowrap text-[1.25rem] font-[750] tracking-[-0.04em] text-foreground no-underline"
      routerLink="/discover"
      >Game tracker<span class="text-[1.8rem] text-accent" aria-hidden="true"
        >✦</span
      ></a
    >
    <nav
      class="mt-12 flex flex-col gap-2 compact:mt-4 compact:flex-row"
      aria-label="Main navigation"
    >
      <a
        class="flex min-h-[48px] items-center gap-[0.8rem] rounded-lg px-4 py-[0.8rem] text-muted no-underline [&.active]:bg-[#aaa0e91a] [&.active]:text-[#d1c3fa] compact:flex-1 compact:justify-center compact:p-2"
        routerLink="/discover"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        ><span class="text-[1.3rem]" aria-hidden="true">◈</span> Discover</a
      >
      <a
        class="flex min-h-[48px] items-center gap-[0.8rem] rounded-lg px-4 py-[0.8rem] text-muted no-underline [&.active]:bg-[#aaa0e91a] [&.active]:text-[#d1c3fa] compact:flex-1 compact:justify-center compact:p-2"
        routerLink="/library"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        ><span class="text-[1.3rem]" aria-hidden="true">▤</span> My Library</a
      >
    </nav>
    <p class="mt-auto pt-12 text-[0.8rem] text-muted compact:hidden">
      Every great game<br />has a place here.
    </p>
  </aside>
  <div class="min-w-0">
    <header
      class="flex min-h-[88px] items-center justify-end gap-6 border-b border-outline px-12 py-4 compact:min-h-[72px] compact:flex-wrap compact:gap-4 compact:px-5 compact:py-[0.8rem]"
    >
      <form
        class="mr-auto flex min-w-0 w-[min(440px,50%)] flex-row gap-2 compact:w-full compact:basis-full"
        role="search"
        (submit)="$event.preventDefault(); search()"
        novalidate
      >
        <label class="sr-only font-semibold" for="game-search"
          >Search games</label
        >
        <input
          class="w-full min-w-0 rounded-[0.45rem] border border-input-border bg-field px-[0.8rem] py-[0.55rem] text-foreground"
          id="game-search"
          type="search"
          placeholder="Search games…"
          autocomplete="off"
          [formField]="searchForm.query"
          [attr.aria-invalid]="searchForm.query().dirty() && searchForm.query().invalid()"
        />
        <button
          class="cursor-pointer disabled:cursor-wait disabled:opacity-65 min-h-[44px] rounded-lg border border-outline bg-transparent px-4 py-[0.6rem] text-foreground shrink-0"
          type="submit"
        >
          Search
        </button>
      </form>
      <p
        class="min-w-0 text-[0.8rem] text-muted [overflow-wrap:anywhere] compact:ml-auto"
        aria-label="Signed in as"
      >
        {{ auth.account()?.email }}
      </p>
      <button
        class="cursor-pointer disabled:cursor-wait disabled:opacity-65 min-h-[44px] rounded-lg border border-outline bg-transparent px-4 py-[0.6rem] text-foreground shrink-0"
        (click)="logout()"
        [disabled]="pending()"
      >
        {{ pending() ? 'Signing out…' : 'Sign out' }}
      </button>
    </header>
    <main
      id="main-content"
      class="mx-auto max-w-[1500px] px-12 py-10 compact:px-5 compact:py-7"
    >
      @if (library.loadError()) {
      <p class="my-4 text-[#ffbbd0]" role="alert">{{ library.loadError() }}</p>
      <button
        class="min-h-[44px] rounded-lg border border-outline px-4 py-2 text-foreground"
        (click)="library.refresh()"
      >
        Retry library status
      </button>
      } @if (error()) {
      <p
        class="my-4 border-l-[3px] border-[#ff9aba] bg-[#ff9aba10] p-[0.8rem] text-[#ffbbd0] [overflow-wrap:anywhere]"
        role="alert"
      >
        {{ error() }}
      </p>
      }
      <p
        class="text-[0.68rem] font-bold uppercase tracking-[0.19em] text-accent"
      >
        Your personal game tracker
      </p>
      <router-outlet />
    </main>
  </div>
</div>
