spring.application.name=api-java

# Same variables as the Node API. DATABASE_URL is translated in ApiJavaApplication.
server.port=${PORT:3000}
server.address=${BIND_HOST:127.0.0.1}

# Flyway owns the schema (src/main/resources/db/migration).
# Hibernate only checks that the entities match the tables, and never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Database work happens in services, not while the JSON response is being written.
spring.jpa.open-in-view=false

# Sessions live in PostgreSQL (Spring Session JDBC); Flyway creates their tables.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.name=game_tracker_java.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=${SESSION_TIMEOUT:7d}

# Error bodies follow RFC 9457 (ProblemDetail), plus a `message` field for Angular.
spring.mvc.problemdetails.enabled=true
